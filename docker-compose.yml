services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./deploy/.env
    volumes:
      - ./deploy/data:/app/data
      - ./deploy/temp:/app/temp
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api
